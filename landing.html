    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        if (isPageRoot || window.parent === window) return; // authoritative miss

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();

              const { done, value } = await reader.read();
              if (done) break;

              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });

        }

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 phone\",\n      i_and: \"Coming soon to Google Play. Meanwhile: open yommo.app in Chrome and tap \\\"Add to Home screen\\\" — same Yommo, today.\",\n      i_ios: \"Coming soon to the App Store. Meanwhile: open yommo.app in Safari, tap Share, then \\\"Add to Home Screen\\\" — works like any app.\",\n      b_title: \"Refrigerator art on steroids.\",\n      b_sub: \"Games, rides, recitals, vet visits, birthdays, kid drawings and family photo moments — one place, both languages, zero strangers.\",\n      foot: \"Be there. Anywhere.\", priv: \"Privacy\", soon: \"COMING SOON\",\n      hw_title: \"Up and running in 3 minutes\",\n      pill: \"FREE · BILINGUAL · PRIVATE\",\n      chip1: \"Game in 1 hour\", chip2: \"Luis's got Mia\", chip3: \"by Leo, age 6\",\n      big1: \"62 million Americans live family life in two languages.\", big2: \"Their calendar doesn't.\",\n      bigp: \"Family apps assume everyone reads English. Yommo! is built bilingual from the first tap — every screen, reminder, and notification in each person's own language. Not translated as an afterthought. Built that way.\",\n      tl_dad: \"…is what Dad sees.\", tl_abu: \"…is what Grandma sees.\", tl_cap: \"Same event, same family, same moment — each person in their language.\",\n      m1: \"No feed.\", m2: \"No ads.\", m3: \"No strangers.\", mp: \"Your family's life belongs to your family. That's the whole business model.\",\n      d1_h: \"Scan the paper schedule\", d1_p: \"The team handout, the school flyer, the dance-studio calendar — photograph it and Yommo's AI reads every date into your family calendar. Review, tap save, done. No typing twelve Saturdays by hand.\",\n      d1_m1: \"team-schedule.jpg\", d1_m2: \"Game vs. Tigres\", d1_m2s: \"Sat, Mar 14 · 4:30 PM\", d1_m3: \"Practice\", d1_m3s: \"Tue, Mar 17 · 6:00 PM\",\n      d2_h: \"The fridge door, upgraded\", d2_p: \"Pin kids' drawings to the family board with a magnet — crooked, like the real fridge. Share photo moments only your family sees, and let Grandma in another city heart the goal she missed. No feed, no algorithm, no strangers. Ever.\",\n      d2_m1: \"by Leo, age 6\", d2_m2: \"Mia's first goal!!\",\n      d3_h: \"Coaches post once, every family knows\", d3_p: \"Run a team or a troop? Create it in Yommo, share one link, and the whole schedule lands on every family's calendar — with directions, reminders, and \\\"who's driving\\\" built in. Update it once; everyone's phone updates.\",\n      d3_m1: \"COACH POSTS\", d3_m2: \"Eagles — Spring schedule\",\n      q_title: \"Questions parents ask\",\n    },\n    es: {\n      open: \"Abrir Yommo!\", hero1: \"Estén ahí.\", hero2: \"Donde sea.\",\n      sub: \"Yommo! es el qué, cuándo y dónde de tu familia — un calendario compartido que toda la familia sí ve. Niños, abuelos, hasta el perro. Funciona en español e inglés, para que nadie quede fuera.\",\n      cta: \"¡Yo! Configurar mi familia — gratis\", cta2: \"Abrir Yommo!\", free: \"Gratis para tu familia · Sin anuncios · Privado, siempre\",\n      ph_today: \"HOY\", ph_game: \"Mia — Partido vs. Tigres\", ph_who: \"¿Quién lleva a Mia?\", ph_got: \"Yo me encargo\",\n      ph_rec: \"Leo — Recital de piano\", ph_thu: \"jueves · 6:00 PM\", ph_vet: \"Rex — Veterinario\", ph_sat: \"sábado · 10:00 AM\",\n      f_title: \"Todo lo que una familia ocupada maneja\",\n      i_title: \"Pon Yommo! en tu teléfono\",\n      i_and: \"Muy pronto en Google Play. Mientras tanto: abre yommo.app en Chrome y toca \\\"Agregar a inicio\\\" — el mismo Yommo, hoy.\",\n      i_ios: \"Muy pronto en el App Store. Mientras tanto: abre yommo.app en Safari, toca Compartir y \\\"Agregar a inicio.\\\"\",\n      b_title: \"Arte de refrigerador con superpoderes.\",\n      b_sub: \"Partidos, transporte, recitales, veterinario, cumpleaños, dibujos de los niños y momentos en foto — un solo lugar, dos idiomas, cero extraños.\",\n      foot: \"Estén ahí. Donde sea.\", priv: \"Privacidad\", soon: \"MUY PRONTO\",\n      hw_title: \"Listo en 3 minutos\",\n      pill: \"GRATIS · BILINGÜE · PRIVADO\",\n      chip1: \"Partido en 1 hora\", chip2: \"Luis lleva a Mia\", chip3: \"por Leo, 6 años\",\n      big1: \"62 millones de estadounidenses viven la vida familiar en dos idiomas.\", big2: \"Su calendario no.\",\n      bigp: \"Las apps familiares asumen que todos leen inglés. Yommo! es bilingüe desde el primer toque — cada pantalla, recordatorio y notificación en el idioma de cada quien. No traducido después. Construido así.\",\n      tl_dad: \"…es lo que ve papá.\", tl_abu: \"…es lo que ve la abuela.\", tl_cap: \"El mismo evento, la misma familia, el mismo momento — cada quien en su idioma.\",\n      m1: \"Sin feed.\", m2: \"Sin anuncios.\", m3: \"Sin extraños.\", mp: \"La vida de tu familia le pertenece a tu familia. Ese es todo el modelo de negocio.\",\n      d1_h: \"Escanea el horario de papel\", d1_p: \"El volante del equipo, el calendario de la escuela — tómale foto y la IA de Yommo convierte cada fecha en eventos de tu calendario. Revisas, guardas, listo. Sin capturar doce sábados a mano.\",\n      d1_m1: \"horario-equipo.jpg\", d1_m2: \"Partido vs. Tigres\", d1_m2s: \"sáb 14 mar · 4:30 PM\", d1_m3: \"Práctica\", d1_m3s: \"mar 17 mar · 6:00 PM\",\n      d2_h: \"La puerta del refri, mejorada\", d2_p: \"Pega los dibujos de los niños en el tablero familiar con un imán — chuecos, como en el refri de verdad. Comparte momentos en foto que solo tu familia ve, y deja que la abuela en otra ciudad le dé corazón al gol que se perdió. Sin feed, sin algoritmo, sin extraños. Nunca.\",\n      d2_m1: \"por Leo, 6 años\", d2_m2: \"¡¡El primer gol de Mia!!\",\n      d3_h: \"El coach publica una vez, todas las familias se enteran\", d3_p: \"¿Diriges un equipo? Créalo en Yommo, comparte un enlace, y todo el horario llega al calendario de cada familia — con direcciones, recordatorios y \\\"quién maneja\\\" incluidos. Lo actualizas una vez; todos los teléfonos se actualizan.\",\n      d3_m1: \"EL COACH PUBLICA\", d3_m2: \"Águilas — o una vez y todas las familias lo reciben. Además mascotas, cumpleaños y fotos.\" }\n    ]\n  };\n  STEPS = {\n    en: [\n      { n: \"1\", h: \"Create your family\", p: \"Go to yommo.app and tap \\\"Yo! Set up my family.\\\" Name your crew and give everyone a color — kids, grandparents, even the dog. Nothing to install.\" },\n      { n: \"2\", h: \"Text the invite\", p: \"One link. Everyone who taps it joins your family's board — in English or Spanish, their choice.\" },\n      { n: \"3\", h: \"Everyone just knows\", p: \"Add an event once and every phone has it — with reminders, directions, and who's driving.\" }\n    ],\n    es: [\n      { n: \"1\", h: \"Crea tu familia\", p: \"Entra a yommo.app y toca \\\"¡Yo! Configurar mi familia.\\\" Ponle nombre a tu equipo y dale un color a cada quien — niños, abuelos, hasta el perro. Sin instalar nada.\" },\n      { n: \"2\", h: \"Manda la invitación\", p: \"Un solo enlace. Quien lo toca se une al tablero de tu familia — en español o inglés, como prefiera.\" },\n      { n: \"3\", h: \"Todos se enteran\", p: \"Agrega un evento una vez y está en todos los teléfonos — con recordatorios, direcciones y quién maneja.\" }\n    ]\n  };\n  FAQS = {\n    en: [\n      { q: \"How much does it cost?\", a: \"Free for your family. No credit card, no trial that expires, no ads.\" },\n      { q: \"Is it really private?\", a: \"Yes. Only people with your family's invite code see your family. There's no public feed, no discovery, and your data is never sold — read the privacy policy at yommo.app/privacy.html.\" },\n      { q: \"Does the whole app work in Spanish?\", a: \"Every screen, every button, every reminder email and notification. Each family member picks their own language — Mom in English, another in Spanish, same calendar.\" },\n      { q: \"Can kids use it?\", a: \"Yes — kids join with the family invite code, get their own color, and can check where they need to be. Parents manage the family.\" },\n      { q: \"Do I need to download anything?\", a: \"Nope — it works in the browser at yommo.app, and you can add it to your home screen like any app. Google Play and App Store versions are coming soon.\" }\n    ],\n    es: [\n      { q: \"¿Cuánto cuesta?\", a: \"Gratis para tu familia. Sin tarjeta, sin prueba que se vence, sin anuncios.\" },\n      { q: \"¿De verdad es privado?\", a: \"Sí. Solo quien tiene el código de invitación de tu familia puede verla. No hay feed público y tus datos nunca se venden — lee la política en yommo.app/privacy.html.\" },\n      { q: \"¿Toda la app funciona en español?\", a: \"Cada pantalla, cada botón, cada correo y notificación. Cada quien elige su idioma — mamá en inglés, la abuela en español, el mismo calendario.\" },\n      { q: \"¿Los niños pueden usarla?\", a: \"Sí — se unen con el código familiar, tienen su propio color y pueden ver dónde tienen que estar. Los papás administran la familia.\" },\n      { q: \"¿Tengo que descargar algo?\", a: \"No, en realidad — funciona en el navegador en yommo.app y puedes agregarla a tu pantalla de inicio como cualquier app. Las versiones de Google Play y App Store vienen muy pronto.\" }\n    ]\n  };\n  componentDidMount() {}\n  renderVals() {\n    const s = this.state, t = this.I[s.lang];\n    const other = s.lang === \"en\" ? \"es\" : \"en\";\n    return {\n      t, feats: this.FEATS[s.lang], steps: this.STEPS[s.lang], faqs: this.FAQS[s.lang],\n      heroWord: t.hero2,\n      ticker: s.lang === \"es\"\n        ? [\"⚽ Partido — sábado 4:30\", \"🚗 ¿Quién lleva a Mia?\", \"🎂 La abuela cumple años\", \"📸 Momento compartido\", \"🩺 Dentista — jueves\", \"🖍️ Arte nuevo en el refri\", \"🏟️ El coach publicó el horario\", \"🐾 Rex — veterinario\"]\n        : [\"⚽ Game — Saturday 4:30\", \"🚗 Who's got Mia?\", \"🎂 Grandma's birthday\", \"📸 New family moment\", \"🩺 Dentist — Thursday\", \"🖍️ New art on the fridge\", \"🏟️ Coach posted the schedule\", \"🐾 Rex — vet visit\"],\n      setEN: () => { try { localStorage.setItem(\"yommo:lang\", \"en\"); } catch(e){} this.setState({ lang: \"en\" }); },\n      setES: () => { try { localStorage.setItem(\"yommo:lang\", \"es\"); } catch(e){} this.setState({ lang: \"es\" }); },\n      enBg: s.lang === \"en\" ? \"#FFB13D\" : \"none\", enFg: s.lang === \"en\" ? \"#3B2A4E\" : \"#CBBFDD\",\n      esBg: s.lang === \"es\" ? \"#FFB13D\" : \"none\", esFg: s.lang === \"es\" ? \"#3B2A4E\" : \"#CBBFDD\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
